name: Deploy Evidence to Cloudflare R2 (via Worker proxy)

on:
 push:
   branches:
    - main # mainブランチにプッシュされたら実行

jobs:
 build-and-deploy:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install dependencies
      run: npm install

    - name: Generate sources
      run: npm run sources

    - name: Build Evidence
      run: npm run build
      env:
        # Workerがルートパスで配信するため BASE_PATH は不要
        # （evidence.config.yaml の deployment.basePath も空に設定済み）
        VITE_GTM_CONTAINER_ID: ${{ vars.VITE_GTM_CONTAINER_ID }}
        VITE_GA4_ENV: ${{ vars.VITE_GA4_ENV }}
        VITE_GA4_PROMOTION_ID: ${{ vars.VITE_GA4_PROMOTION_ID }}
        VITE_GA4_REPORT_DEF_ID: ${{ vars.VITE_GA4_REPORT_DEF_ID }}

    - name: Sync build output to R2
      working-directory: build/test_evidence
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
       set -euo pipefail
       # wrangler r2 object put に再帰アップロードのオプションはないため、1ファイルずつアップロードする。
       # xargs -P で並列実行し、逐次ループより体感時間を縮める。
       upload_file() {
         local file="$1"
         local key="${file#./}"
         local content_type
         case "$key" in
           *.html) content_type="text/html; charset=utf-8" ;;
           *.css) content_type="text/css" ;;
           *.js) content_type="application/javascript" ;;
           *.json) content_type="application/json" ;;
           *.wasm) content_type="application/wasm" ;;
           *.svg) content_type="image/svg+xml" ;;
           *.png) content_type="image/png" ;;
           *.jpg|*.jpeg) content_type="image/jpeg" ;;
           *.parquet) content_type="application/octet-stream" ;;
           *) content_type="application/octet-stream" ;;
         esac
         npx wrangler r2 object put "test-evidence-assets/${key}" --file="${file}" --content-type="${content_type}" --remote
       }
       export -f upload_file

       find . -type f -print0 | xargs -0 -P 8 -I {} bash -c 'upload_file "$@"' _ {}

    - name: Deploy Worker
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: worker
        command: deploy
