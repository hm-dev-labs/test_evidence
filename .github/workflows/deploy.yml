name: Deploy Evidence to GitHub Pages

on:
 push:
   branches:
    - main # mainブランチにプッシュされたら実行

jobs:
 build-and-deploy:
   runs-on: ubuntu-latest
   environment:
     name: github-pages
     url: ${{ steps.deploy-pages.outputs.page_url }}
   permissions:
     contents: read
     pages: write      # GitHub Pagesへの書き込み権限
     id-token: write
   steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install dependencies
      run: npm install

    - name: Generate sources
      run: npm run sources

    - name: Build Evidence
      run: npm run build
      env:
        BASE_PATH: /${{ github.event.repository.name }}
        VITE_GTM_CONTAINER_ID: ${{ secrets.VITE_GTM_CONTAINER_ID }}
        VITE_GA4_ENV: ${{ secrets.VITE_GA4_ENV }}
        VITE_GA4_PROMOTION_ID: ${{ secrets.VITE_GA4_PROMOTION_ID }}
        VITE_GA4_REPORT_DEF_ID: ${{ secrets.VITE_GA4_REPORT_DEF_ID }}

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'build/test_evidence' # Evidenceのデフォルトビルド出力先

    - name: Deploy to GitHub Pages
      id: deploy-pages
      uses: actions/deploy-pages@v4
